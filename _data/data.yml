experiences:
  title: Experiencia
  info:
    - role: IT Operations
      time: Abr 2026 - Ago 2026
      company: Fujitsu
      details: |
        Responsable de la operación diaria, monitorización y mantenimiento de sistemas
        informáticos críticos para la administración pública andaluza.

        - Diagnóstico y resolución de incidencias en servidores, redes y servicios.
        - Aplicación de procedimientos de configuración de software y hardware.
        - Soporte a la continuidad operativa mediante herramientas de gestión.
        - Elaboración de documentación técnica y normativa.

    - role: Operador de Sistemas TI
      time: Oct 2020 - Abr 2026
      company: Ayesa · Sevilla
      details: |
        Operador de Sistemas para la Consejería de Turismo, Regeneración, Justicia y
        Administración Local de la Junta de Andalucía.

        - Administración de servidores Linux/RHEL.
        - Servidores de aplicaciones WildFly y bases de datos Oracle.
        - Gestión de certificados digitales y PKI.
        - Configuración de nginx y despliegue de servicios con Docker.
        - Automatización de tareas mediante scripts Bash.

    - role: Técnico Superior de Microinformática y Administración de Infraestructuras
      time: Abr 2014 - Oct 2020
      company: Ayesa Advanced Technologies · Sevilla
      details: |
        Mantenimiento avanzado, configuración y optimización de sistemas
        microinformáticos, redes y servidores en la administración pública andaluza.

        - Gestión del parque informático institucional.
        - Resolución de incidencias complejas de hardware y software.
        - Implantación de soluciones de red seguras.
        - Continuidad operativa de servicios críticos para múltiples departamentos.

    - role: Técnico Microinformático
      time: Mar 2014
      company: Juzgados de El Prado de San Sebastián · Sevilla
      details: |
        Soporte técnico a usuarios de la Junta de Andalucía (sustitución por vacaciones).

    - role: Técnico Microinformático / Administrador de Sistemas (prácticas)
      time: Abr 2013 - Jun 2013
      company: Ayesa Advanced Technologies · Sevilla
      details: |
        Prácticas profesionales como técnico microinformático y administrador de sistemas.

    - role: Administrativo de Logística
      time: 2007 - 2009
      company: Universal Lease Iberia · Sevilla
      details: |
        Recepción, ubicación y registro informático de los vehículos destinados al
        departamento de remarketing.

    - role: Teleoperador de Soporte Técnico ADSL
      time: 2006 - 2007
      company: Sitel · Sevilla
      details: |
        Soporte técnico ADSL a clientes de Orange.

    - role: Encargado de Gestión y Logística de Vehículos
      time: 2005 - 2006
      company: Comarent · Sevilla
      details: |
        Gestión y logística de vehículos en campas.

